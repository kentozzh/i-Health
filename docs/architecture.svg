e-width="2" marker-end="url(#arrow)"/><rect x="502" y="316.65" width="76" height="18.7" rx="4" fill="#FFFFFF"/><text x="540" y="329.85" font-size="11" fill="#5F6368" text-anchor="middle">结构化事件流</text><line x1="171" y1="444" x2="171" y2="496" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/><line x1="282" y1="536" x2="306" y2="536" stroke="#E8710A" stroke-width="2" marker-end="url(#arrow)"/><line x1="528" y1="536" x2="552" y2="536" stroke="#E8710A" stroke-width="2" marker-end="url(#arrow)"/><line x1="774" y1="536" x2="798" y2="536" stroke="#E8710A" stroke-width="2" marker-end="url(#arrow)"/><line x1="909" y1="576" x2="909" y2="656" stroke="#8430CE" stroke-width="2" marker-end="url(#arrow)"/><rect x="887.5" y="606.65" width="43" height="18.7" rx="4" fill="#FFFFFF"/><text x="909" y="619.85" font-size="11" fill="#8430CE" text-anchor="middle">未命中</text><line x1="540" y1="928" x2="540" y2="976" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/><rect x="481.76" y="942.65" width="116.48" height="18.7" rx="4" fill="#FFFFFF"/><text x="540" y="955.85" font-size="11" fill="#5F6368" text-anchor="middle">检索读写 / 会话落库</text><line x1="295" y1="1106" x2="295" y2="1076" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/><line x1="785" y1="1106" x2="785" y2="1076" stroke="#5F6368" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/></svg>