<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/></marker></defs><text x="72" y="36" font-size="20" fill="#202124" text-anchor="start" font-weight="700">i-Health RAG 智能健康问答系统 · 总体架构</text><rect x="60" y="60" width="960" height="86" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5" rx="8"/><text x="540" y="98.125" font-size="13" fill="#202124" text-anchor="middle">浏览器前端　static/index.html</text><text x="540" y="116.975" font-size="13" fill="#202124" text-anchor="middle">会话侧边栏 · Markdown 渲染 · 打字机流式 · 知识库类型过滤</text><rect x="60" y="196" width="960" height="104" fill="#E6F4EA" stroke="#137333" stroke-width="1.5" rx="8"/><text x="540" y="234.25" font-size="12.5" fill="#202124" text-anchor="middle">服务层　FastAPI (app.py)</text><text x="540" y="252.375" font-size="12.5" fill="#202124" text-anchor="middle">/api/query · /api/history · /api/sessions · /api/stream (WebSocket)</text><text x="540" y="270.5" font-size="12.5" fill="#202124" text-anchor="middle">asyncio.to_thread 线程池 + Queue 桥接 · 事件状态机 start / status / token / end</text><rect x="60" y="352" width="960" height="92" fill="#FEF7E0" stroke="#B06000" stroke-width="1.5" rx="8"/><text x="540" y="393.125" font-size="13" fill="#202124" text-anchor="middle">编排层　IntegratedSystem (main_v2.py)</text><text x="540" y="411.975" font-size="13" fill="#202124" text-anchor="middle">query_stream() 事件生成器 · 四级递进召回调度 · 会话历史滚动窗口</text><rect x="60" y="496" width="222" height="80" fill="#FFF3E0" stroke="#E8710A" stroke-width="1.5" rx="8"/><text x="171" y="531.5" font-size="12" fill="#202124" text-anchor="middle">① 问候语正则规则</text><text x="171" y="548.9" font-size="12" fill="#202124" text-anchor="middle">零成本直接返回</text><rect x="306" y="496" width="222" height="80" fill="#FFF3E0" stroke="#E8710A" stroke-width="1.5" rx="8"/><text x="417" y="531.5" font-size="12" fill="#202124" text-anchor="middle">② Redis 精确缓存</text><text x="417" y="548.9" font-size="12" fill="#202124" text-anchor="middle">命中即返回</text><rect x="552" y="496" width="222" height="80" fill="#FFF3E0" stroke="#E8710A" stroke-width="1.5" rx="8"/><text x="663" y="531.5" font-size="12" fill="#202124" text-anchor="middle">③ BM25 + MySQL FAQ</text><text x="663" y="548.9" font-size="12" fill="#202124" text-anchor="middle">softmax ≥ 0.85 判定</text><rect x="798" y="496" width="222" height="80" fill="#FFF3E0" stroke="#E8710A" stroke-width="1.5" rx="8"/><text x="909" y="531.5" font-size="12" fill="#202124" text-anchor="middle">④ RAG 检索生成</text><text x="909" y="548.9" font-size="12" fill="#202124" text-anchor="middle">调用大模型</text><text x="72" y="599.2" font-size="12" fill="#5F6368" text-anchor="start">①②③ 命中即直接返回，全程不调用大模型；③ 命中后回写 Redis 形成自增缓存</text><rect x="60" y="656" width="960" height="272" fill="#F3E8FD" stroke="#8430CE" stroke-width="1.5" rx="8"/><text x="92" y="680.25" font-size="15" fill="#202124" text-anchor="start" font-weight="700">RAG 层　rag/core</text><rect x="90" y="694" width="900" height="44" fill="#FFFFFF" stroke="#8430CE" stroke-width="1" rx="8"/><text x="540" y="720.2" font-size="12" fill="#202124" text-anchor="middle">① BERT 意图分类　bert-base-chinese 微调　→　通用问题直接作答 / 专业问题进入检索</text><rect x="90" y="750" width="900" height="44" fill="#FFFFFF" stroke="#8430CE" stroke-width="1" rx="8"/><text x="540" y="776.2" font-size="12" fill="#202124" text-anchor="middle">② 检索策略路由　LLM 依据问法选择 HyDE / 子查询拆分 / 回溯简化 / 直接检索</text><rect x="90" y="806" width="900" height="44" fill="#FFFFFF" stroke="#8430CE" stroke-width="1" rx="8"/><text x="540" y="832.2" font-size="12" fill="#202124" text-anchor="middle">③ 混合检索与重排　BGE-M3 稠密+稀疏 → Milvus → WeightedRanker 融合 → 父块去重 → bge-reranker-large 精排</text><rect x="90" y="862" width="900" height="44" fill="#FFFFFF" stroke="#8430CE" stroke-widt