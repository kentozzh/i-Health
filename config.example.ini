[mysql]
host = localhost
user = root
password = your_password
database = health_qa

[redis]
host = localhost
port = 6379
password = your_password
db = 0

[logger]
log_file = logs/app.log

[milvus]
host = localhost
port = 19530
database_name = iHealth
collection_name = health_rag

[llm]
model = qwen-plus
dashscope_api_key = sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 20
candidate_m = 2
# 检索模式: dense(稠密单路) / hybrid(稠密+稀疏融合) / full(hybrid + 交叉编码器重排)
# 依据 RAGAS 消融实验(rag_ablation.py): 同池宽下 dense 全面不劣于 full,
# 且检索 P50 仅 0.6s vs full 的 26.6s -> 默认取 dense
retrieval_mode = dense

[app]
valid_sources = ["亚健康", "体重管理", "作息睡眠", "心理健康", "营养学", "运动健身"]
customer_service_phone = 182****1901
history_length = 5